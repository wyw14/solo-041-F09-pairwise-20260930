<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioTreat 污泥回流</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><header><div class="brand">BioTreat 工艺联控</div><nav><a href="/process">工艺总控</a><a href="/aeration">曝气调节</a><a aria-current="page" href="/sludge">污泥回流</a><a href="/alarms">异常处置</a></nav></header>
<main><div class="page-head"><div><h1>污泥回流与排空</h1><div class="muted">主备泵交接、流量确认和阀路互斥</div></div><div class="status"><span class="dot"></span><span id="health">checking</span></div></div>
<div class="grid"><section class="panel wide"><h2>回流泵</h2><table><thead><tr><th>设备</th><th>处理线</th><th>运行</th><th>流量</th></tr></thead><tbody id="pumps"></tbody></table></section><section class="panel"><h2>主备交接</h2><form id="handover"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><label>退出泵<input name="from" value="pump-line-1-A"></label><label>接管泵<input name="to" value="pump-line-1-B"></label><button>开始交接</button></form></section><section class="panel"><h2>二沉池排空</h2><form id="drain"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><label>池号<input name="basin" value="SD1"></label><button>申请排空阀路</button></form></section><section class="panel"><h2>泵故障上报</h2><form id="fail"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><button class="danger">标记当前序列故障并生成延迟停泵</button></form></section><section class="panel wide"><h2>延迟停泵补偿</h2><table><thead><tr><th>处理线</th><th>设备</th><th>状态</th><th>执行次数</th><th>下次重试</th><th>失败原因</th></tr></thead><tbody id="compensations"></tbody></table><div class="muted" id="comp-empty" hidden>无待执行或待复核补偿任务</div></section><section class="panel wide"><h2>操作结果</h2><pre id="output">等待操作</pre></section></div></main>
<script src="/assets/common.js"></script><script>
const STATUS_TEXT={pending:'待执行/重试中',manual_review:'待人工复核'};
function fmtTime(t){return t?new Date(t).toLocaleString():'-'}
async function load(){
  const d=await request('/api/sludge');
  document.querySelector('#pumps').innerHTML=d.pumps.map(p=>`<tr><td>${p.id}</td><td>${p.line_id}</td><td>${p.running?'运行':'停止'}</td><td>${p.flow}</td></tr>`).join('');
  const rows=(d.compensations||[]).map(c=>`<tr><td>${c.line_id}</td><td>${c.device_id}</td><td>${STATUS_TEXT[c.status]||c.status}</td><td>${c.attempts}</td><td>${fmtTime(c.due_at)}</td><td>${c.last_error?escapeHtml(c.last_error):'-'}</td></tr>`);
  document.querySelector('#compensations').innerHTML=rows.join('');
  document.querySelector('#comp-empty').hidden=rows.length>0;
}
function escapeHtml(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
document.querySelector('#handover').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{show(await request(`/api/sludge/${f.get('line')}/handover`,{method:'POST',body:JSON.stringify({from_pump:f.get('from'),to_pump:f.get('to')})}));load()}catch(err){showError(err)}});
document.querySelector('#drain').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{show(await request(`/api/sludge/${f.get('line')}/drain/${f.get('basin')}`,{method:'POST',body:'{}'}))}catch(err){showError(err)}});
document.querySelector('#fail').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{show(await request(`/api/sludge/${f.get('line')}/sequences/fail`,{method:'POST',body:'{}'}));load()}catch(err){showError(err)}});
load().catch(showError);setInterval(()=>load().catch(()=>{}),2000);
</script></body></html>
